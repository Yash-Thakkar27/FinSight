# FinSight app configuration. Restrained, neutral theme with one accent colour.

[theme]
base = "light"
primaryColor = "#1f4e79"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f6f8"
textColor = "#1f2a37"
font = "sans serif"

[browser]
# The app makes no outbound calls: usage statistics are switched off.
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[server]
# No bind address is set here, so the same file works locally and on a hosting service.
# To keep a local run off your network (and stop Streamlit looking up the external IP
# address when started headless), start it with:  --server.address localhost
