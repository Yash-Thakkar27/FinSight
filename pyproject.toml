[project]
name = "finsight"
version = "0.1.0"
description = "Financial Markets & Comparable Companies Analytics Platform (Indian Equities)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
