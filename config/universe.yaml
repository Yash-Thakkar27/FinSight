# FinSight company universe. This file is the only place the universe is defined.
# sector_type: non_financial | bank | nbfc | insurance
# peer_group: comps are drawn from the same peer_group by default.
# statement_currency (optional, default INR): currency the source reports statements in.
#   Set explicitly per company: Yahoo's financialCurrency flag is not reliable (HCLTECH.NS
#   is flagged USD but its statements are in INR). A validation check guards the choice.

benchmark:
  ticker: "^NSEI"
  name: Nifty 50

# Risk-free rate is a documented config value, never fetched silently.
# value is an annual rate as a decimal. A single constant rate is used for the
# whole history (simplification, see docs/assumptions.md). Supplied by the
# project owner on 2026-10-06.
risk_free_rate:
  value: 0.052599       # 5.2599% annualized, implicit yield at cut-off
  instrument: "91-day Government of India T-bill, RBI weekly auction"
  source: "RBI press release 'Treasury Bills: Full Auction Result', https://rbi.org.in/Scripts/BS_PressReleaseDisplay.aspx?prid=63500"
  as_of_date: 2026-09-02

trading_days_per_year: 252
price_history_years: 5

# FX series used to convert statements reported in a foreign currency into INR.
# rate = INR per 1 unit of the currency. A longer history than prices is kept so
# every fiscal period in the statements has a full-period average available.
fx:
  USD:
    ticker: "INR=X"        # Yahoo USD/INR
    history_years: 10

companies:
  # Information Technology
  - ticker: TCS.NS
    name: Tata Consultancy Services
    sector: Information Technology
    industry: IT Services
    peer_group: it_services
    sector_type: non_financial
