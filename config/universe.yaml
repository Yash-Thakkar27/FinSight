    name: Infosys
    sector: Information Technology
    industry: IT Services
    peer_group: it_services
    sector_type: non_financial
    # Yahoo serves Infosys statements in USD (FY2026 revenue 2.016e10, EPS 0.80).
    # Verified 2026-10-07 against the raw snapshot; see docs/limitations.md.
    statement_currency: USD
